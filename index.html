<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 4.18l6 3v6.72c0 3.75-2.55 7.27-6 8.25-3.45-.98-6-4.5-6-8.25V9.18l6-3zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KoshDrishti (कोषदृष्टि) • AICTE Security Deposit & FDR Management Portal</title>
    <meta name="description" content="Centralized regulatory security deposit and FDR governance platform for AICTE Regulation Bureau, Ministry of Education, Govt. of India." />
    <!-- Fonts: Noto Serif (Govt Authority), Plus Jakarta Sans (UI), JetBrains Mono (Financial refs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('runtime-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'runtime-error-banner';
          el.style = 'position:fixed;top:0;left:0;right:0;background:#991b1b;color:#fff;padding:20px;z-index:9999999;font-family:sans-serif;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,0.5)';
          document.body.prepend(el);
        }
        el.innerHTML = '<strong style="font-size:16px;">⚠️ JavaScript Error:</strong> ' + e.message + '<br><small style="color:#fca5a5;">' + (e.filename || '') + ':' + (e.lineno || '') + '</small><pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;overflow:auto;margin-top:10px;">' + (e.error && e.error.stack ? e.error.stack : 'No stack') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('runtime-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'runtime-error-banner';
          el.style = 'position:fixed;top:0;left:0;right:0;background:#991b1b;color:#fff;padding:20px;z-index:9999999;font-family:sans-serif;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,0.5)';
          document.body.prepend(el);
        }
        el.innerHTML = '<strong style="font-size:16px;">⚠️ Unhandled Promise Error:</strong> ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown') + '<pre style="background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;overflow:auto;margin-top:10px;">' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
