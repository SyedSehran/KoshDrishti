version: '3.8'

services:
  # 1. FastAPI Python Backend (OCR, ML Scorer, CBS Triangulation, Audit Engine)
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-vishwas-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aicte_user:vault_secret_2026@postgres-db:5432/vishwas_fdr_db
      - REDIS_URL=redis://redis-broker:6379/0
      - MINIO_ENDPOINT=minio-storage:9000
      - MINIO_ACCESS_KEY=aicte_vault_minio
      - MINIO_SECRET_KEY=MinIO_Secure_Token_2026!
      - JWT_SECRET_KEY=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    depends_on:
      - postgres-db
      - redis-broker
      - minio-storage
    volumes:
      - .:/app
    command: uvicorn backend.fastapi_app:app --host 0.0.0.0 --port 8000 --reload

  # 2. Celery Worker (Background Maturity Tracking & Statutory Reminders)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-celery-worker
    environment:
      - DATABASE_URL=postgresql://aicte_user:vault_secret_2026@postgres-db:5432/vishwas_fdr_db
      - REDIS_URL=redis://redis-broker:6379/0
    depends_on:
      - redis-broker
      - postgres-db
    command: celery -A backend.tasks worker --loglevel=info

  # 3. Celery Beat (Scheduled 90-60-30 Day Expiry Triggers)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-celery-beat
    environment:
      - REDIS_URL=redis://redis-broker:6379/0
    depends_on:
      - redis-broker
    command: celery -A backend.tasks beat --loglevel=info

  # 4. PostgreSQL Relational Database (Append-Only Cryptographic Audit Tables)
  postgres-db:
    image: postgres:16-alpine
    container_name: aicte-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aicte_user
      - POSTGRES_PASSWORD=vault_secret_2026
      - POSTGRES_DB=vishwas_fdr_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 5. Redis Queue Broker & Cache
  redis-broker:
    image: redis:7-alpine
    container_name: aicte-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 6. MinIO S3 Encrypted Document Storage
  minio-storage:
    image: minio/minio:latest
    container_name: aicte-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=aicte_vault_minio
      - MINIO_ROOT_PASSWORD=MinIO_Secure_Token_2026!
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
